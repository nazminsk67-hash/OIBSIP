<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - PizzaHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 16px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .features {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: #333;
        }

        .feature-item:last-child { margin-bottom: 0; }

        .feature-icon {
            width: 24px;
            height: 24px;
            background: #f97316;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #f97316;
            color: white;
        }

        .btn-primary:hover {
            background: #ea580c;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(249, 115, 22, 0.3);
        }

        @media (max-width: 480px) {
            .offline-container { padding: 30px 16px; }
            h1 { font-size: 24px; }
            .emoji { font-size: 60px; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="emoji">📡</div>
        <h1>You're Offline</h1>
        <p>Your connection was lost. PizzaHub will sync when you're back online.</p>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>Browse cached menu</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>View order history</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">✓</div>
                <span>Check rewards status</span>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-primary" onclick="location.reload()">🔄 Try Again</button>
        </div>
    </div>

    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
